name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Verify tag and source versions before installing dependencies
        run: node scripts/verify-release.mjs --tag "$RELEASE_TAG" --require-tag --commit "$RELEASE_COMMIT"
      - name: Require a release commit from main
        run: git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
      - run: npm ci
      - run: npm run check
      - run: npm run icons:check
      - run: npm run zip
      - name: Verify packaged manifest and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive=".output/oddy-${version}-chrome.zip"
          unzip -t "$archive"
          unzip -p "$archive" manifest.json > "$RUNNER_TEMP/archived-manifest.json"
          node scripts/verify-release.mjs \
            --tag "$RELEASE_TAG" --require-tag --commit "$RELEASE_COMMIT" \
            --manifest .output/chrome-mv3/manifest.json \
            --manifest "$RUNNER_TEMP/archived-manifest.json"
          mkdir -p .output/release
          cp "$archive" .output/release/
          cd .output/release
          sha256sum "oddy-${version}-chrome.zip" > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-${{ github.ref_name }}
          path: .output/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error
      - name: Verify assets and ensure the remote annotated tag has not moved
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          version="${RELEASE_TAG#v}"
          test "$(unzip -p "oddy-${version}-chrome.zip" manifest.json | jq -r .version)" = "$version"
          tag_object="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq 'select(.object.type == "tag") | .object.sha')"
          test -n "$tag_object"
          remote_commit="$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq 'select(.object.type == "commit") | .object.sha')"
          test "$remote_commit" = "$RELEASE_COMMIT"
      - name: Create a new draft with assets, then publish
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "oddy-${version}-chrome.zip" SHA256SUMS \
            --verify-tag --draft --generate-notes --title "Oddy $RELEASE_TAG" \
            --notes "Built from commit $RELEASE_COMMIT. Extract the Chrome ZIP and load the extracted folder via chrome://extensions. Verify the ZIP against SHA256SUMS."
          gh release edit "$RELEASE_TAG" --draft=false
